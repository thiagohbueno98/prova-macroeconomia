<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macroeconomia ITA — Estudo</title>
<meta name="description" content="Resumos, laboratórios interativos, flashcards e as 164 questões das listas de Macroeconomia (Prof. Thiago Caliari, ITA).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  // aplica o tema salvo antes de pintar a página
  try { var t = localStorage.getItem('macro_ita_theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
</script>
<style>
:root{
  --bg:#0a0f1e; --bg2:#0e1428; --card:#131b33; --card2:#0f162b; --line:#232e4d; --line2:#2e3b60;
  --tx:#e7ecf8; --tx2:#aab4cf; --mut:#7d89a8;
  --acc:#60a5fa; --ok:#34d399; --no:#f87171; --warn:#fbbf24;
  --c1:#60a5fa; --c2:#34d399; --c3:#c084fc; --c4:#fbbf24;
  --okbg:rgba(52,211,153,.12); --nobg:rgba(248,113,113,.12); --warnbg:rgba(251,191,36,.10); --accbg:rgba(96,165,250,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18);
  --a:#60a5fa; --at:var(--a);
  --r:14px;
}
[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f2f5fb; --line:#dfe5f0; --line2:#cbd4e6;
  --tx:#121829; --tx2:#3f4a66; --mut:#68738f;
  --acc:#2563eb; --ok:#047857; --no:#c62828; --warn:#a15c07;
  --c1:#2563eb; --c2:#047857; --c3:#7c3aed; --c4:#a15c07;
  --okbg:rgba(4,120,87,.09); --nobg:rgba(198,40,40,.08); --warnbg:rgba(161,92,7,.08); --accbg:rgba(37,99,235,.08);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  --at:color-mix(in srgb, var(--a) 62%, #000);
}
[style*="--a"]{--at:var(--a)}
[data-theme="light"] [style*="--a"]{--at:color-mix(in srgb,var(--a) 62%,#000)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:290px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:40}
.side-top{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.brand .logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-weight:800;font-size:15px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--mut);font-size:12px}
.score{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.score .row{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2)}
.score .row b{color:var(--tx)}
.pbar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin:7px 0 6px;display:flex}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.pbar i.bad{background:var(--no);opacity:.75}
.nav{overflow-y:auto;padding:10px 10px 24px;flex:1}
.nav h6{margin:14px 8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--tx2);text-decoration:none;font-size:13.5px;border:1px solid transparent}
.nav a:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:var(--card);border-color:var(--line2);color:var(--tx)}
.nav .dot{width:9px;height:9px;border-radius:50%;background:var(--a);flex-shrink:0}
.nav .lbl{flex:1;min-width:0}
.nav .lbl b{display:block;font-size:12px;color:var(--at);font-weight:700}
.nav .lbl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.nav .cnt.full{color:var(--ok)}
.nav .ic{width:22px;text-align:center}
.nav .badge{background:var(--nobg);color:var(--no);border-radius:20px;font-size:11px;padding:0 7px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 24px;max-width:1080px;margin:0 auto}
.top h1{font-size:17px;margin:0;line-height:1.25}
.top p{margin:0;font-size:12.5px;color:var(--mut)}
.top .grow{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.iconbtn:hover{border-color:var(--line2)}
#menuBtn{display:none}
.tabs{display:flex;gap:4px;padding:0 24px 10px;max-width:1080px;margin:0 auto;overflow-x:auto}
.tabs[hidden]{display:none}
.tabs a{padding:7px 13px;border-radius:9px;text-decoration:none;color:var(--tx2);font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.tabs a:hover{color:var(--tx);background:var(--card)}
.tabs a.on{background:var(--a);color:#0a0f1e;border-color:transparent}
[data-theme="light"] .tabs a.on{background:var(--at);color:#fff}
.view{padding:22px 24px 90px;max-width:1080px;margin:0 auto;width:100%}
.scrim{display:none}

@media (max-width:900px){
  .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  #menuBtn{display:grid}
  .top-in{padding:10px 16px}
  .tabs{padding:0 16px 10px}
  .view{padding:16px 16px 80px}
}

/* ---------- componentes do resumo ---------- */
.tldr{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 16%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--a) 35%,var(--line));border-radius:var(--r);padding:16px 18px;margin-bottom:18px;font-size:15.5px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec h3 .n{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--at);font-size:13px;font-weight:800}
.sec h4{margin:18px 0 8px;font-size:14.5px;color:var(--tx)}
.sec p{margin:8px 0}
.sec ul,.sec ol{margin:8px 0;padding-left:22px}
.sec li{margin:3px 0}
.sec.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:linear-gradient(180deg,var(--warnbg),var(--card) 60%)}
.sec.art{border-color:color-mix(in srgb,var(--c2) 40%,var(--line))}
.muted{color:var(--mut)}
.grid2,.grid3{display:grid;gap:12px;margin:12px 0}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.box ul{padding-left:18px;margin:6px 0 0}
.box > b:first-child{display:inline-block;margin-bottom:2px}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
.up{color:var(--ok);font-weight:700}.dn{color:var(--no);font-weight:700}
.f{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13.5px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;display:inline-block;color:var(--tx);margin:4px 0;font-weight:600}
.box .f{display:block;width:fit-content;margin:6px 0}
.f.big{display:block;width:fit-content;max-width:100%;font-size:16px;padding:8px 14px;margin:10px auto;text-align:center;border-color:color-mix(in srgb,var(--a) 45%,var(--line));color:var(--at)}
.t{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;display:block;overflow-x:auto}
.t thead,.t tbody{display:table;width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t.sm{font-size:12.5px}
.t tr.hl td{background:var(--accbg)}
.trap,.extra,.ex{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid}
.trap{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.trap b:first-child{color:var(--warn)}
.extra{background:var(--accbg);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.extra b:first-child{color:var(--acc)}
.ex{background:var(--card2);border-color:var(--line);border-left:4px solid var(--a)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:var(--accbg);color:var(--acc);vertical-align:middle}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin:12px 0;font-size:13.5px}
.chain span{background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-weight:600}
.chain span:not(:last-child)::after{content:"→";margin:0 -4px 0 10px;color:var(--at);font-weight:800}
.chain span:not(:last-child){margin-right:16px}
.chain.lbl::before{content:attr(data-lbl);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--at);width:72px;flex-shrink:0}
.cta-lab{font-size:14px}
.quote{margin-top:12px;border-left:4px solid var(--a);padding:6px 14px;font-style:italic;font-size:15px}
.quote span{display:block;font-style:normal;font-size:13px;color:var(--mut);margin-top:4px}
.mini{padding-left:18px;margin:6px 0 0}
.tconta{border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;font-size:14px;background:var(--card2)}
.tconta .tc-h{grid-column:1/-1;text-align:center;font-weight:700;padding:6px;border-bottom:2px solid var(--tx2)}
.tconta .tc-a{padding:10px 14px;border-right:2px solid var(--tx2)}
.tconta .tc-p{padding:10px 14px}
.debate{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.debate:first-of-type{border-top:0;margin-top:0;padding-top:0}
.debate h4{margin:0 0 8px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.pc{grid-template-columns:1fr}}
.pro,.con{border-radius:12px;padding:10px 14px;font-size:13.5px;border:1px solid}
.pro{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.con{background:var(--nobg);border-color:color-mix(in srgb,var(--no) 30%,transparent)}
.pro > b{color:var(--ok)}.con > b{color:var(--no)}
.pro ul,.con ul{padding-left:18px;margin:6px 0 0}
.fluxo{max-width:560px;margin:8px auto}
.fluxo svg{width:100%;height:auto;color:var(--tx2)}
.fx-box{fill:color-mix(in srgb,var(--a) 18%,var(--card2));stroke:var(--a);stroke-width:1.5}
.fx-mk{fill:var(--card2);stroke:var(--line2)}
.fx-t{fill:var(--tx);font-weight:700;font-size:15px;text-anchor:middle}
.fx-s{fill:var(--tx2);font-size:12px;text-anchor:middle}
.fx-c{fill:var(--mut);font-size:12px;text-anchor:middle}
.fx-money{fill:none;stroke:var(--c4);stroke-width:2;color:var(--c4)}
.fx-l{font-size:11px;fill:var(--c4);text-anchor:middle;font-weight:600}
.hbars{margin:10px 0;display:grid;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 54px;align-items:center;gap:10px;font-size:13px}
.hbar .tr{height:16px;border-radius:6px;background:var(--card2);border:1px solid var(--line);overflow:hidden;position:relative}
.hbar .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:560px){.hbar{grid-template-columns:110px 1fr 46px;font-size:12px}}

/* ---------- questões ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.search{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:220px;flex:1;max-width:340px}
.search:focus{outline:none;border-color:var(--acc)}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.q-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.q-tag{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--at)}
.q-st{font-size:12px;font-weight:700}
.q-txt{font-weight:600;font-size:15px;margin:0 0 12px}
.opts{display:grid;gap:7px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;transition:border-color .15s,transform .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--nobg);border-color:var(--no);text-decoration:line-through;opacity:.85}
.opt.dim{opacity:.5}
.opt.sel{border-color:var(--acc);background:var(--accbg);font-weight:600}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid}
.fb.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 40%,transparent);font-weight:400}
.fb.no{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 40%,transparent);font-weight:400}
.fb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:700}
.fb-h button{background:none;border:0;text-decoration:underline;font-size:12.5px;color:var(--tx2);padding:0}
.fb p{margin:0;color:var(--tx)}
.qfig{margin:4px 0 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.qfig figcaption{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 18%,var(--card));color:var(--tx)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ---------- laboratório ---------- */
.lab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.lab h3{margin:0 0 4px;font-size:17px}
.lab > p.muted{margin:0 0 12px}
.lab-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.lab-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.lab-grid,.lab-grid.three{grid-template-columns:1fr}}
.chart{width:100%;height:auto;display:block;max-width:520px;margin:0 auto;overflow:visible}
.chart .ax{stroke:var(--tx2);stroke-width:1.5}
.chart .axl{fill:var(--tx2);font-size:12px;font-weight:600}
.chart .cv{stroke-width:3;stroke-linecap:round;fill:none}
.chart .cv.s{stroke:var(--c1)}.chart .cv.d{stroke:var(--c2)}.chart .cv.v{stroke:var(--c3)}.chart .cv.o{stroke:var(--c4)}
.chart .cv.ghost{stroke:var(--mut);stroke-width:2;stroke-dasharray:5 5;opacity:.7}
.chart .cvl{font-size:12.5px;font-weight:800}
.chart .cvl.s{fill:var(--c1)}.chart .cvl.d{fill:var(--c2)}.chart .cvl.v{fill:var(--c3)}.chart .cvl.o{fill:var(--c4)}.chart .cvl.ghost{fill:var(--mut);font-weight:600}
.chart .gd{stroke:var(--mut);stroke-dasharray:3 4;fill:none;stroke-width:1.2}
.chart .pt{fill:var(--tx);stroke:var(--card);stroke-width:2}
.chart .pt.old{fill:var(--mut)}
.chart .ptl{font-size:12.5px;font-weight:800;fill:var(--tx)}
.chart .tick{font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}
.chart .shift{stroke:var(--warn);stroke-width:2;fill:none}
.chart .ptitle{font-size:12.5px;font-weight:800;fill:var(--tx)}
.chart .bar{rx:4}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:12px 0}
.readout div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.readout small{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.readout b{font-size:17px;font-variant-numeric:tabular-nums}
.readout i{font-style:normal;font-size:13px;margin-left:3px}
.explain{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:10px;padding:10px 14px;font-size:14px;min-height:56px}
.explain p{margin:4px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tx2);font-weight:600}
.field input[type=number]{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;width:100%}
.field input[type=range]{width:100%;accent-color:var(--acc)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}
.calc-t input{width:76px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:5px 7px}
.result{font-size:15px;margin-top:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.steps button{border:1px solid var(--line2);background:var(--card2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.steps button.on{background:var(--a);color:#0a0f1e;border-color:var(--a)}
[data-theme="light"] .steps button.on{background:var(--at);color:#fff}
.game-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.game-item:last-child{border-bottom:0}
.game-item .gbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.game-item .gbtns button{border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;min-width:40px}
.game-item .gbtns button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.game-item .gbtns button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.game-item .gexp{grid-column:1/-1;font-size:13px;color:var(--tx2)}
@media (max-width:600px){.game-item{grid-template-columns:1fr}.game-item .gbtns{justify-content:flex-start}}

/* ---------- flashcards ---------- */
.fc-wrap{max-width:640px;margin:0 auto}
.fc{perspective:1200px;height:270px;margin:14px 0;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line2);box-shadow:var(--shadow)}
.fc-f{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 20%,var(--card)),var(--card));font-size:21px;font-weight:700}
.fc-b{background:var(--card);transform:rotateY(180deg);font-size:16.5px}
.fc small{position:absolute;top:14px;left:18px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--at)}
.fc .hint{position:absolute;bottom:12px;font-size:12px;color:var(--mut);font-weight:500}
.fc-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}

/* ---------- home ---------- */
.hero{border-radius:20px;padding:26px 26px 22px;background:radial-gradient(circle at 85% 0%,rgba(139,92,246,.28),transparent 55%),radial-gradient(circle at 0% 100%,rgba(59,130,246,.22),transparent 50%),var(--card);border:1px solid var(--line);margin-bottom:18px}
.hero h2{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat small{display:block;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--a)}
.acard b.id{font-size:12px;color:var(--at);text-transform:uppercase;letter-spacing:.06em}
.acard h4{margin:0;font-size:15px;line-height:1.3}
.acard p{margin:0;font-size:12.5px;color:var(--mut);flex:1}
.acard .links{display:flex;gap:6px;flex-wrap:wrap}
.how{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.how li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;counter-increment:s}
.how li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--accbg);color:var(--acc);font-weight:800;font-size:12px;margin-right:8px}
.h2{font-size:16px;margin:24px 0 10px}

/* ---------- simulado ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:color-mix(in srgb,var(--a) 22%,var(--card));border-color:var(--a);color:var(--tx)}
.palette{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 14px}
.palette button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--card2);font-size:12px;font-weight:700;color:var(--tx2)}
.palette button.ans{background:var(--accbg);border-color:var(--acc);color:var(--tx)}
.palette button.cur{outline:2px solid var(--acc);outline-offset:1px}
.palette button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.palette button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.simbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.big-score{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1}
details.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
details.rev summary{cursor:pointer;font-weight:600;font-size:14px}
details.rev p{font-size:13.5px;margin:6px 0}
.note{font-size:13px;color:var(--mut)}
.kbd{font-family:"JetBrains Mono",monospace;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--tx2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--a)}
.fitem small{font-size:11px;font-weight:800;color:var(--at);text-transform:uppercase;letter-spacing:.06em}
.fitem b{display:block;font-size:14px;margin:2px 0 4px}
.fitem .f{font-size:14px}
.fitem span{display:block;font-size:12.5px;color:var(--mut)}
.traps{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.traps li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:9px 13px;font-size:14px}
</style>
</head>
